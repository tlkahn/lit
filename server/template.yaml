AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lit licensing server

Parameters:
  BaseUrl:
    Type: String
  StripePriceId:
    Type: String
  SesFromEmail:
    Type: String
    Default: "noreply@lit.solar"
  LogLevel:
    Type: String
    Default: ""
    AllowedValues: ["", "debug"]
  DomainName:
    Type: String
    Default: "lit.solar"
  HostedZoneId:
    Type: String
    Default: ""
  EnableCustomDomain:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  SsmPrefix:
    Type: String
    Default: "/lit/"
    Description: SSM parameter path prefix (e.g. /lit/ or /lit/production/)
  TurnstileSiteKey:
    Type: String
    Default: ""
    Description: Cloudflare Turnstile site key for bot protection on buy page

Conditions:
  HasCustomDomain: !Equals [!Ref EnableCustomDomain, "true"]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref LicensesTable
        BASE_URL: !Ref BaseUrl
        LOG_LEVEL: !Ref LogLevel
        SSM_PREFIX: !Ref SsmPrefix

Resources:
  LicensesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: license_id
          AttributeType: S
        - AttributeName: stripe_session_id
          AttributeType: S
        - AttributeName: email_hash
          AttributeType: S
        - AttributeName: stripe_charge_id
          AttributeType: S
      KeySchema:
        - AttributeName: license_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: stripe_session_id-index
          KeySchema:
            - AttributeName: stripe_session_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: email_hash-index
          KeySchema:
            - AttributeName: email_hash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: stripe_charge_id-index
          KeySchema:
            - AttributeName: stripe_charge_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  CheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: checkout.handler
      CodeUri: src/handlers/
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LicensesTable
        - SESCrudPolicy:
            IdentityName: "*"
        - SSMParameterReadPolicy:
            ParameterName: "lit/*"
      Environment:
        Variables:
          STRIPE_PRICE_ID: !Ref StripePriceId
          SES_FROM_EMAIL: !Ref SesFromEmail
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/checkout
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - checkout.ts

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: webhook.handler
      CodeUri: src/handlers/
      MemorySize: 256
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LicensesTable
        - SESCrudPolicy:
            IdentityName: "*"
        - SSMParameterReadPolicy:
            ParameterName: "lit/*"
      Environment:
        Variables:
          STRIPE_PRICE_ID: !Ref StripePriceId
          SES_FROM_EMAIL: !Ref SesFromEmail
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/webhook
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - webhook.ts

  LicenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: license.handler
      CodeUri: src/handlers/
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LicensesTable
        - SESCrudPolicy:
            IdentityName: "*"
        - SSMParameterReadPolicy:
            ParameterName: "lit/*"
      Environment:
        Variables:
          STRIPE_PRICE_ID: !Ref StripePriceId
          SES_FROM_EMAIL: !Ref SesFromEmail
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/license
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - license.ts

  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: validate.handler
      CodeUri: src/handlers/
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LicensesTable
        - SESCrudPolicy:
            IdentityName: "*"
        - SSMParameterReadPolicy:
            ParameterName: "lit/*"
      Environment:
        Variables:
          STRIPE_PRICE_ID: !Ref StripePriceId
          SES_FROM_EMAIL: !Ref SesFromEmail
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/validate
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - validate.ts

  RecoverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: recover.handler
      CodeUri: src/handlers/
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LicensesTable
        - SESCrudPolicy:
            IdentityName: "*"
        - SSMParameterReadPolicy:
            ParameterName: "lit/*"
      Environment:
        Variables:
          STRIPE_PRICE_ID: !Ref StripePriceId
          SES_FROM_EMAIL: !Ref SesFromEmail
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/recover
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - recover.ts

  SuccessPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: success-page.handler
      CodeUri: src/handlers/
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LicensesTable
        - SESCrudPolicy:
            IdentityName: "*"
        - SSMParameterReadPolicy:
            ParameterName: "lit/*"
      Environment:
        Variables:
          STRIPE_PRICE_ID: !Ref StripePriceId
          SES_FROM_EMAIL: !Ref SesFromEmail
      Events:
        Api:
          Type: Api
          Properties:
            Path: /purchase/success
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - success-page.ts

  CancelPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cancel-page.handler
      CodeUri: src/handlers/
      MemorySize: 128
      Events:
        Api:
          Type: Api
          Properties:
            Path: /purchase/cancel
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - cancel-page.ts

  RecoverPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: recover-page.handler
      CodeUri: src/handlers/
      MemorySize: 128
      Events:
        Api:
          Type: Api
          Properties:
            Path: /recover
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - recover-page.ts

  EarlyAccessPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: early-access-page.handler
      CodeUri: src/handlers/
      MemorySize: 256
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: "lit/*"
      Environment:
        Variables:
          STRIPE_PRICE_ID: !Ref StripePriceId
          SES_FROM_EMAIL: !Ref SesFromEmail
      Events:
        Api:
          Type: Api
          Properties:
            Path: /early-access
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - early-access-page.ts

  PrivacyPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: privacy-page.handler
      CodeUri: src/handlers/
      MemorySize: 128
      Events:
        Api:
          Type: Api
          Properties:
            Path: /privacy
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - privacy-page.ts

  RefundPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: refund-page.handler
      CodeUri: src/handlers/
      MemorySize: 128
      Events:
        Api:
          Type: Api
          Properties:
            Path: /refund
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - refund-page.ts

  BuyPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: buy-page.handler
      CodeUri: src/handlers/
      MemorySize: 128
      Environment:
        Variables:
          TURNSTILE_SITE_KEY: !Ref TurnstileSiteKey
      Events:
        Api:
          Type: Api
          Properties:
            Path: /buy
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - buy-page.ts

  EarlyAccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: early-access.handler
      CodeUri: src/handlers/
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LicensesTable
        - SESCrudPolicy:
            IdentityName: "*"
        - SSMParameterReadPolicy:
            ParameterName: "lit/*"
      Environment:
        Variables:
          STRIPE_PRICE_ID: !Ref StripePriceId
          SES_FROM_EMAIL: !Ref SesFromEmail
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/early-access
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - early-access.ts

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Condition: HasCustomDomain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasCustomDomain
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasCustomDomain
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasCustomDomain
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOAC
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /Prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiGatewayOrigin
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
          - PathPattern: /purchase/*
            TargetOriginId: ApiGatewayOrigin
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
          - PathPattern: /early-access
            TargetOriginId: ApiGatewayOrigin
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
          - PathPattern: /recover
            TargetOriginId: ApiGatewayOrigin
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
          - PathPattern: /privacy
            TargetOriginId: ApiGatewayOrigin
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
          - PathPattern: /refund
            TargetOriginId: ApiGatewayOrigin
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
          - PathPattern: /buy
            TargetOriginId: ApiGatewayOrigin
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD

  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  LicensesTableName:
    Description: DynamoDB table name
    Value: !Ref LicensesTable
  LicensesTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt LicensesTable.Arn
  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Condition: HasCustomDomain
    Value: !GetAtt CloudFrontDistribution.DomainName
  WebsiteBucketName:
    Description: S3 bucket for static website content
    Condition: HasCustomDomain
    Value: !Ref WebsiteBucket

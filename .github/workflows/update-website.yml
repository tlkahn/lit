name: Update Website Download Button

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to update website for (e.g. v0.1.0)'
        required: true

jobs:
  update-website:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout lit repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Get release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }} \
              --jq '.head_branch // empty')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve release tag"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "::error::head_branch '$TAG' is not a valid release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get S3 bucket name
        id: bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name lit-production \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" \
            --output text)
          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Verify DMG exists in S3
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          URL="https://lit.solar/releases/Lit_${TAG}_aarch64.dmg"
          STATUS=$(curl -sI "$URL" -o /dev/null -w "%{http_code}")
          if [ "$STATUS" != "200" ]; then
            echo "::error::DMG not accessible at $URL (HTTP $STATUS)"
            exit 1
          fi
          echo "DMG verified: $URL (HTTP $STATUS)"

      - name: Compute download values
        id: values
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          DOWNLOAD_URL="https://lit.solar/releases/Lit_${TAG}_aarch64.dmg"
          DOWNLOAD_LABEL="Download ${TAG} for Mac"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "download_label=$DOWNLOAD_LABEL" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache llm-rs build
        uses: actions/cache@v4
        with:
          path: llm-rs/target
          key: llm-rs-${{ runner.os }}-${{ hashFiles('llm-rs/Cargo.lock') }}

      - name: Build llm CLI
        run: |
          cd llm-rs
          cargo build --release -p llm-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Generate release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_DEFAULT_MODEL: gpt-4o-mini
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          bash scripts/generate-release-notes.sh --force "$TAG"

      - name: Clone website repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/tlkahn/tlkahn.github.io.git" website

      - name: Convert and copy release notes to website
        run: |
          # Remove legacy content section that conflicts with content/releases.md page
          rm -rf website/content/releases
          bash scripts/convert-release-notes.sh website/data/releases
          if ls website/data/releases/*.yaml 1>/dev/null 2>&1; then
            echo "Release data files:"
            ls website/data/releases/
          else
            echo "No release notes converted"
          fi

      - name: Update content/_index.md
        run: |
          FILE="website/content/_index.md"
          sed -i "s|^download_url:.*|download_url: \"${{ steps.values.outputs.download_url }}\"|" "$FILE"
          sed -i "s|^download_label:.*|download_label: \"${{ steps.values.outputs.download_label }}\"|" "$FILE"

      - name: Update hugo.toml
        run: |
          FILE="website/hugo.toml"
          sed -i "s|^  downloadURL = .*|  downloadURL = '${{ steps.values.outputs.download_url }}'|" "$FILE"
          sed -i "s|^  version = .*|  version = '${{ steps.values.outputs.version }}'|" "$FILE"

      - name: Verify changes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.values.outputs.version }}"
          grep -q "$TAG" website/content/_index.md || { echo "::error::Tag not found in _index.md"; exit 1; }
          grep -q "$TAG" website/hugo.toml || { echo "::error::Tag not found in hugo.toml"; exit 1; }
          grep -q "$VERSION" website/hugo.toml || { echo "::error::Version not found in hugo.toml"; exit 1; }
          echo "Verified: tag $TAG and version $VERSION present in website files"

      - name: Commit and push
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/_index.md hugo.toml data/releases/
          git rm -r --cached content/releases/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit — website already up to date"
            exit 0
          fi
          git commit -m "Update download button and release notes for ${{ steps.tag.outputs.tag }}"
          git push

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: hugo --minify
        working-directory: website

      - name: Verify releases page
        run: |
          if [ ! -f website/public/releases/index.html ]; then
            echo "::error::Releases page not found in Hugo output"
            exit 1
          fi
          echo "Verified: /releases/ page exists in build output"

      - name: Sync to S3
        run: aws s3 sync website/public/ s3://${{ steps.bucket.outputs.name }} --delete --exclude "releases/*.dmg"

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[0]=='lit.solar'].Id" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

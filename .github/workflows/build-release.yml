name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  LLM_VERSION: v0.11

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone llm-rs
        run: git clone --depth 1 https://github.com/tlkahn/llm-rs.git ../llm-rs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-apple-darwin
      - name: Configure git for private deps
        run: git config --global url."https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Sync version from git tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            # --abbrev=0 (nearest tag, no -N-gSHA suffix) MUST match the dev
            # fallback flag in src-tauri/build.rs so the About dialog and bundle
            # metadata agree for the same binary. See scripts/tests/release.bats.
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          fi
          bash scripts/set-version.sh "${VERSION#v}"
      - run: bun install --frozen-lockfile
      - name: Fetch libpdfium
        run: bash scripts/fetch-pdfium.sh
      - name: Install and stage llm binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$LLM_VERSION" --repo tlkahn/llm-rs \
            --pattern "llm-${LLM_VERSION}-macos-universal.tar.gz" --dir /tmp/llm
          tar xzf /tmp/llm/llm-${LLM_VERSION}-macos-universal.tar.gz -C /tmp/llm
          mkdir -p src-tauri/binaries
          cp /tmp/llm/llm src-tauri/binaries/llm-aarch64-apple-darwin
      - name: Pre-build lit-cli
        working-directory: src-tauri
        env:
          LIT_LICENSE_VERIFYING_KEY_B64: ${{ secrets.LIT_LICENSE_VERIFYING_KEY_B64 }}
        run: |
          mkdir -p binaries
          touch binaries/lit-cli-aarch64-apple-darwin
          cargo build --release --bin lit-cli --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/lit-cli binaries/lit-cli-aarch64-apple-darwin
      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain)
          echo "$CERT_INFO"
          CERT_ID=$(echo "$CERT_INFO" | grep "Developer ID Application" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV
          rm certificate.p12
      - name: Sign libpdfium.dylib
        run: |
          codesign --sign "${{ env.APPLE_SIGNING_IDENTITY }}" \
            --timestamp \
            --force \
            --options runtime \
            src-tauri/libs/libpdfium.dylib
      - name: Build Tauri app
        env:
          LIT_LICENSE_VERIFYING_KEY_B64: ${{ secrets.LIT_LICENSE_VERIFYING_KEY_B64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >
          bun tauri build
          --target aarch64-apple-darwin
          --config '{"build":{"beforeBuildCommand":"bun run build"}}'
      - name: Configure AWS credentials
        if: github.event_name == 'release'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get S3 bucket name
        if: github.event_name == 'release'
        id: bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name lit-production \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" \
            --output text)
          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to S3
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          DMG=$(find src-tauri/target/aarch64-apple-darwin -name '*.dmg' -type f | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found for aarch64-apple-darwin"
            exit 1
          fi
          cp "$DMG" "Lit_${TAG}_aarch64.dmg"
          aws s3 cp "Lit_${TAG}_aarch64.dmg" "s3://${{ steps.bucket.outputs.name }}/releases/Lit_${TAG}_aarch64.dmg"

      - name: Generate and upload update manifest
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          # release_upload_update_artifacts() reads the bucket from $S3_BUCKET.
          export S3_BUCKET="${{ steps.bucket.outputs.name }}"
          # release-lib.sh derives REPO_ROOT from its own BASH_SOURCE, so the
          # manifest schema and S3 key layout live in one place (the lib).
          source scripts/release-lib.sh
          release_generate_update_manifest "$TAG"
          release_compute_checksums "$TAG"
          release_upload_update_artifacts "$TAG"
          release_upload_checksums "$TAG"

name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-apple-darwin
      - name: Configure git for private deps
        run: git config --global url."https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: bun install --frozen-lockfile
      - name: Fetch libpdfium
        run: bash scripts/fetch-pdfium.sh
      - name: Pre-build lit-cli
        working-directory: src-tauri
        env:
          LIT_TRIAL_SIGNING_KEY_B64: ${{ secrets.LIT_TRIAL_SIGNING_KEY_B64 }}
          LIT_LICENSE_VERIFYING_KEY_B64: ${{ secrets.LIT_LICENSE_VERIFYING_KEY_B64 }}
        run: |
          mkdir -p binaries
          touch binaries/lit-cli-aarch64-apple-darwin
          cargo build --release --bin lit-cli --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/lit-cli binaries/lit-cli-aarch64-apple-darwin
      - name: Build Tauri app
        env:
          LIT_TRIAL_SIGNING_KEY_B64: ${{ secrets.LIT_TRIAL_SIGNING_KEY_B64 }}
          LIT_LICENSE_VERIFYING_KEY_B64: ${{ secrets.LIT_LICENSE_VERIFYING_KEY_B64 }}
        run: >
          bun tauri build
          --target aarch64-apple-darwin
          --config '{"build":{"beforeBuildCommand":"bun run build"}}'
      - name: Configure AWS credentials
        if: github.event_name == 'release'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get S3 bucket name
        if: github.event_name == 'release'
        id: bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name lit-production \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" \
            --output text)
          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to S3
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          DMG=$(find src-tauri/target/aarch64-apple-darwin -name '*.dmg' -type f | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found for aarch64-apple-darwin"
            exit 1
          fi
          cp "$DMG" "Lit_${TAG}_aarch64.dmg"
          aws s3 cp "Lit_${TAG}_aarch64.dmg" "s3://${{ steps.bucket.outputs.name }}/releases/Lit_${TAG}_aarch64.dmg"

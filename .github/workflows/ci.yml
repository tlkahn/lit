name: CI

on:
  workflow_dispatch:

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  check-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd server && bun install --frozen-lockfile
      - run: cd server && bun run typecheck
      - run: cd server && bun run test

  check-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Create placeholders for externalBin and resource checks
        working-directory: src-tauri
        run: |
          mkdir -p binaries libs
          touch "binaries/lit-cli-$(rustc -vV | awk '/^host:/ { print $2 }')"
          touch libs/libpdfium.dylib
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

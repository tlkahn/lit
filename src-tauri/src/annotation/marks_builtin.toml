# Built-in philological mark definitions.
# Compiled into the binary via include_str! in marks.rs.
# Each top-level table is a mark code. `label` is required; `icon`, `before`,
# `after`, and the nested `[<code>.style]` table are optional.
# A workspace may override or extend these via `.lit/marks.toml`.

[nb]
label = "nota bene"
icon = "B"
[nb.style]
font-weight = "bold"

[it]
label = "italic"
icon = "I"
[it.style]
font-style = "italic"

[ul]
label = "underline"
icon = "U"
[ul.style]
text-decoration = "underline"

[st]
label = "strikethrough"
icon = "S"
[st.style]
text-decoration = "line-through"

[sc]
label = "small caps"
icon = "sc"
[sc.style]
font-variant = "small-caps"

[hi]
label = "highlight"
icon = "hi"
[hi.style]
background = "rgba(255,235,59,0.35)"

[sic]
label = "sic"
[sic.style]
text-decoration = "wavy underline #e53935"

[crux]
label = "crux desperationis"
before = "†"
after = "†"
[crux.style]
opacity = "0.6"

[lac]
label = "lacuna"
before = "["
after = "]"
[lac.style]
text-decoration = "dashed underline"

[del]
label = "deletion"
[del.style]
text-decoration = "line-through"
opacity = "0.5"

[sup]
label = "supplied"
before = "⟨"
after = "⟩"
[sup.style]
background = "rgba(144,202,249,0.15)"

[conj]
label = "conjecture"
[conj.style]
font-style = "italic"
text-decoration = "dashed underline"

[dub]
label = "dubious"
[dub.style]
text-decoration = "dotted underline"
opacity = "0.7"

[gloss]
label = "gloss"
[gloss.style]
font-size = "0.85em"
opacity = "0.65"

[interp]
label = "interpolation"
before = "⟦"
after = "⟧"
[interp.style]
background = "rgba(158,158,158,0.1)"

[em]
label = "emphasis"
[em.style]
text-decoration = "underline"
background = "rgba(68,138,255,0.08)"

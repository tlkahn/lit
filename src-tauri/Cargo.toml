[workspace]
members = [".", "crates/turboref-core", "crates/keygen"]
resolver = "2"

[package]
name = "lit"
version = "0.0.0"
edition = "2021"
default-run = "lit"

[lib]
name = "lit_lib"
crate-type = ["lib", "cdylib", "staticlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 3339 timestamp formatting for .lkg manifests; `clock` enables Utc::now().
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
serde_yaml = "0.9"
toml = "0.8"
notify-debouncer-mini = "0.5"
gray_matter = "0.2"
unicode-normalization = "0.1"
walkdir = "2"
tauri-plugin-opener = "2"
turboref-core = { path = "crates/turboref-core" }
regex = "1"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.35", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
petgraph = "0.7"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
rayon = "1"
smallvec = "1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time"] }
lmpdf = { git = "https://github.com/tlkahn/lmpdf.git", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sentencex = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
url = "2"
tauri-plugin-deep-link = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ocr_cli = { git = "https://github.com/tlkahn/ocr-cli.git", package = "ocr-cli", rev = "849d32c" }
llm-core = { git = "https://github.com/tlkahn/llm-rs.git", rev = "665090e" }
llm-openai = { git = "https://github.com/tlkahn/llm-rs.git", rev = "665090e" }
llm-anthropic = { git = "https://github.com/tlkahn/llm-rs.git", rev = "665090e" }
futures = "0.3"
research-hub = { path = "../../research-hub" }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
# Used by the atomic .lkg import path (stage-then-rename); also used in tests.
tempfile = "3"
quick-xml = "0.38"
strsim = "0.11"

[[bin]]
name = "lit-cli"
path = "src/bin/lit-cli.rs"

[dev-dependencies]
async-trait = "0.1"
serde_json = "1"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
filetime = "0.2"
